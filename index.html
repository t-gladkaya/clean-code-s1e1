<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
      charset="utf-8"
    >
  </head>
  <body>
    <header class="site-header">
      <img class="site-header__image" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix Picture">
      <a
        class="site-header__more-info"
        href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </header>
    <main class="page">
      <div id="add-task-section" class="task-form">
        <label class="task-form__label" for="new-task">Add Item</label>
        <div class="task-form__row">
          <input id="new-task"class="task-form__input" type="text">
          <button class="task-form__btn">Add</button>
        </div>
      </div>
      <h2>Todo</h2>
      <ul id="incomplete-tasks" class="task-list">
        <li class="task-item">
          <input class="task-item__checkbox" type="checkbox">
          <label class="task-item__label">Pay Bills</label>
          <input class="task-item__input" type="text">
          <button class="task-item__edit-btn">Edit</button>
          <button class="task-item__delete-btn">
            <img class="task-item__delete-icon" src="./remove.svg" alt="Remove image">
          </button>
        </li>
        <li class="task-item task-item--editing">
          <input class="task-item__checkbox" type="checkbox">
          <label class="task-item__label">Go Shopping</label>
          <input class="task-item__input" type="text" value="Go Shopping">
          <button class="task-item__edit-btn">Save</button>
          <button class="task-item__delete-btn">
            <img class="task-item__delete-icon" src="./remove.svg" alt="Remove image">
          </button>
        </li>
      </ul>
      <h2>Completed</h2>
      <ul id="completed-tasks" class="task-list task-list--completed">
        <li class="task-item">
          <input class="task-item__checkbox" type="checkbox" checked>
          <label class="task-item__label">See the Doctor</label>
          <input class="task-item__input" type="text">
          <button class="task-item__edit-btn">Edit</button>
          <button class="task-item__delete-btn">
            <img class="task-item__delete-icon" src="./remove.svg" alt="Remove image">
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
